# Activate a satellite only while it has direct contact with a ground station.
satellite_activation = "ground_station_contact"

# Restrict generated positions to Europe and nearby Atlantic/Mediterranean areas.
bbox = [35.0, -15.0, 65.0, 35.0]

# Generate one topology update every five seconds for two minutes.
resolution = 5
duration = 120

[network_params]
# Use 1 Gbit/s links and require a 25-degree elevation angle for ground contact.
bandwidth_kbits = 1_000_000
min_elevation = 25.0

# Connect each ground station to all visible satellites, subject to its antenna limit.
ground_station_connection_type = "all"

# Add direct links between ground stations with a 1.3 path-stretch factor.
ground_station_bandwidth_kbits = 1_000_000
ground_station_path_stretch = 1.3

[compute_params]
# Default microVM resources used by satellites and inherited by ground stations.
vcpu_count = 1
mem_size_mib = 256
disk_size_mib = 1
kernel = "vmlinux-5.12.bin"
rootfs = "server.img"

[[shell]]
# A small 32-satellite shell: four orbital planes with eight satellites each.
planes = 4
sats = 8
altitude_km = 550
inclination = 53.0
arc_of_ascending_nodes = 360.0
eccentricity = 0.0

[[ground_station]]
name = "potsdam"
lat = 52.3906
long = 13.0645
antenna_number = 2

[ground_station.compute_params]
# The validator ground station needs its own image and slightly more resources.
vcpu_count = 1
mem_size_mib = 512
disk_size_mib = 2
rootfs = "validator.img"

[[ground_station]]
name = "berlin"
lat = 52.5200
long = 13.4050
antenna_number = 1
