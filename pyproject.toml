[project]
name = "quest"
version = "0.1.0"
description = "QUEST: orbital topology generation (fork of OpenFogStack Celestial)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "numba>=0.58",
    "sgp4>=2.23",
    "cerberus>=1.3.5",
]

[project.optional-dependencies]
animation = ["vtk>=9.3", "seaborn>=0.13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celestial"]
